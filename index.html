    <style>
      /* Native feel tweaks */
      html, body {
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        user-select: none;
      }
      #root {
        height: 100%;
      }
    </style>

    <script>
      // One-time cleanup for browsers left with the previously-broken
      // service worker/cache that kept re-serving a stale hashed bundle.
       // Only removes the retired app-shell worker. Messaging workers and
       // unrelated caches must remain untouched.
      (function () {
        if (!('serviceWorker' in navigator)) return;
        var GUARD = 'pwa-stale-cleanup-done';
        if (sessionStorage.getItem(GUARD) === '1') return;
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          var staleRegs = regs.filter(function (r) {
            var worker = r.active || r.waiting || r.installing;
            return worker && new URL(worker.scriptURL).pathname === '/sw.js';
          });
          return Promise.all(staleRegs.map(function (r) { return r.unregister(); })).then(function () {
            return staleRegs.length > 0;
          });
        }).then(function (didCleanup) {
          sessionStorage.setItem(GUARD, '1');
          if (didCleanup) window.location.reload();
        }).catch(function () {
          sessionStorage.setItem(GUARD, '1');
        });
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
